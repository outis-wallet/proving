# A spike: stwo's commitment (polynomial extension and Merkle hashing) on the GPU through wgpu
# (Vulkan, Metal, DX12 natively; WebGPU in browsers), checked bit for bit against stwo's SIMD
# backend. Its own workspace, so wgpu stays out of the proving workspace's lockfile.
[package]
name = "stwo-gpu-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
stwo = { path = "../stwo", features = ["prover", "parallel"] }
# The constraint evaluation spike (src/constraint): the traced constraints and the evaluation hook.
stwo-constraint-framework = { path = "../constraint-framework", features = ["prover", "parallel"] }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
itertools = "0.12"
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"

# The device's memory heaps and budget (src/memory.rs), through wgpu's Vulkan hal: the version
# wgpu-hal 30 uses.
[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple")))'.dependencies]
ash = "0.38"

# The lean commitment's zero-copy coefficients (src/committer.rs): the host's memory wrapped as
# Metal buffers.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "block2", "MTLAllocation", "MTLBuffer", "MTLDevice", "MTLResource"] }

[dev-dependencies]
log = "0.4"
num-traits = "0.2"
# Translates the kernels to MSL and HLSL in a test, validated without optional capabilities.
naga = { version = "30", features = ["wgsl-in", "msl-out", "hlsl-out"] }
