<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGPU bridge probe</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f4; --muted: #9a9aa0; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<h1>WebGPU bridge probe</h1>
<p>What the bridge needs from this browser, checked in a worker: cross-origin isolation, WebGPU in
workers, Atomics.waitAsync, writeBuffer from a shared WebAssembly.Memory's views, the adapter's
limits. No build needed. POSTs the result to /result.</p>
<pre id="log">probing…</pre>
<script type="module">
const log = document.getElementById("log");
const show = (result) => {
  log.textContent = JSON.stringify(result, null, 1);
  fetch("/result", { method: "POST", body: JSON.stringify({ event: "probe", ...result }) }).catch(() => {});
};
const page = { userAgent: navigator.userAgent, crossOriginIsolated: self.crossOriginIsolated, webgpu_in_page: !!navigator.gpu };
const worker = new Worker("./probe.worker.mjs", { type: "module" });
worker.onmessage = ({ data }) => show({ page, worker: data });
worker.onerror = (event) => show({ page, worker_error: event.message || "worker failed to start" });
</script>
</body>
</html>
